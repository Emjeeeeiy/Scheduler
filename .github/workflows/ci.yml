name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo, so nothing gets a token that could. (The
# default token's permissions depend on repository settings; this pins them.)
permissions:
  contents: read

# Actions are pinned to a commit, not a tag: a tag can be moved to different
# code after the fact. The comment names the release the commit is on;
# Dependabot (.github/dependabot.yml) opens the PR to move it.

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Cheapest, fastest-failing check first.
      - run: npm run lint

      # Pure-logic tests (date, layout, recurrence, stats, normalize) — no
      # Firebase project needed, since these never touch the network.
      - run: npm test

      # Component/hook behaviour under jsdom, plus the api/ handler glue.
      - run: npm run test:dom

      # Cloud Functions logic. Its pretest hook copies the shared modules into
      # functions/shared/ first (gitignored build output, so a fresh checkout
      # has none). Needs no `npm ci` inside functions/: the tested modules
      # import nothing but each other.
      - run: npm run test:functions

      # SSR-renders every view against mock data. Needs no live Firebase
      # project either — ScheduleContext/AuthContext are aliased to fixtures
      # for this build (see tests/smoke/vite.config.js).
      - run: npm run test:render

      # Proves the app actually bundles. VITE_FIREBASE_* env vars are not
      # needed at build time — firebaseReady only gates initializeApp() at
      # runtime in the browser — so this runs with no secrets configured.
      - run: npm run build

  # firestore.rules is the app's data boundary, so it is tested against the
  # real rules engine. Its own job because it needs a JDK (the Firestore
  # emulator is a Java program) and downloads the emulator — neither belongs
  # in the fast checks above.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - run: npm run test:rules
