<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Two theme colours, so the OS chrome around an installed window
         follows the same system/light/dark preference the app itself does
         rather than pinning one of the two. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="A personal time-blocking scheduler: plan the day in blocks, and see where the hours actually went." />
    <script>
      /* Stamp the stored theme onto <html> before first paint, so the app's
         first frame is already in the right one. data-theme is the only thing
         tokens.css keys off, and until React mounts nothing else writes it —
         so without this, a reload that lands on the session skeleton (which
         asks for no theme of its own) painted in whatever prefers-color-scheme
         happened to say and stayed that way for the whole signed-in app.
         'system' is deliberately left unstamped, which is exactly the state
         tokens.css expects: with no explicit choice, its media query decides.
         Runs here, synchronously in <head>, so there is no wrong-theme frame
         to correct. */
      try {
        var bootTheme = localStorage.getItem('cadence-app:theme')
        if (bootTheme === 'light' || bootTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', bootTheme)
        }
      } catch (e) {
        /* No storage access: <html> stays unstamped, the media query owns the
           theme, and ThemeContext settles it on mount. */
      }
    </script>
    <style>
      /* Boot splash: the launch screen that follows Android's own white+logo
         frame the moment our page takes over. Plain CSS in <head> (not the
         bundle) so it renders the instant the HTML arrives. One beat of
         theatre and then out of the way: the hands take a full turn each — the long
         minute hand well ahead of the short hour one — and only once both have
         come to rest does the word mark rise. No spinner and no shimmer bar —
         a splash that introduces itself and gets out of the way.
         --boot-settle is the contract with lib/bootSplash.js: the moment the
         last letter has landed, and by construction after the slower hand has
         finished its turn (1400ms against 1800ms here). JS reads it back so
         the fade can never begin while something is still moving, and drops it
         to 0 under prefers-reduced-motion, where nothing animates at all.

         Unconditional: every cold start plays it, signed-in reload included.
         It introduces the app the same way for everyone, and the session hint
         it used to key off only ever saved ~1.8s in front of someone already
         waiting for it. Gate still reads that hint — for the skeleton, not
         for this.

         Fixed light, like the auth screen it hands over to — entry is one
         continuous light frame, and a launch screen that flipped with the OS
         would be the one part of entry that did. The app's own theme takes
         over the instant this node is removed. */
      /* :has(#boot-splash) gates this to the splash's own lifetime: without
         the guard it would outrank the app's `body { background:
         var(--color-page) }` and pin the background light after every later
         theme change. Once React dismisses the splash node, this stops
         matching and the app's theme owns the background fully. */
      body:has(#boot-splash) {
        background: #f9f9f7;
      }
      #boot-splash {
        --boot-settle: 1800ms;
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(18px, 6vw, 30px);
        background: #f9f9f7;
        color: #0b0b0b;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 0.28s ease;
      }
      #boot-splash.boot-splash--hide {
        opacity: 0;
        pointer-events: none;
      }
      /* vw-based so the mark holds its share of a phone's width instead of
         sitting small in the middle of it, with a ceiling so it stays a mark
         rather than becoming the subject on a desktop window. */
      .boot-splash__mark {
        width: clamp(140px, 36vw, 210px);
        height: clamp(140px, 36vw, 210px);
      }
      /* Two hands, two speeds, and that difference is the whole animation: the long
         minute hand takes a full turn in 850ms while the short hour hand
         needs 1400ms for the same ground, so it visibly lags behind and the
         mark reads as a clock rather than as a badge spinning. Deliberately
         not a live timepiece — nothing here reads the wall clock, so a splash
         never has to carry a time-correct pose or re-solve itself for the
         visitor's timezone.

         One iteration, not a loop, and `forwards` holds the landing pose. The
         hands have to arrive somewhere: a sweep the fade merely interrupts
         reads as an app that cut the animation off, and this one finishes — at
         1400ms, well clear of the 1800ms settle below — then sits at twelve
         while the word mark finishes landing. The ease-out is what makes them
         look like they arrived rather than stopped.
         transform-box: view-box resolves `center` to the viewBox midpoint
         (12 12), so each hand pivots on the clock's own axis at any rendered
         size, and the two are separate groups precisely so one duration can
         override the other — the single group this replaced could only ever
         spin both at the same rate. */
      .boot-splash__hand {
        transform-box: view-box;
        transform-origin: center;
        animation: boot-sweep 850ms cubic-bezier(0.33, 1, 0.68, 1) 1 forwards;
      }
      .boot-splash__hand--hour {
        animation-duration: 1400ms;
      }
      @keyframes boot-sweep {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      /* Held off until both hands have come to rest (1400ms) and the mark has had
         a beat of its own, so the name arrives as the settling of the
         composition rather than on top of it. */
      .boot-splash__title {
        margin: 0;
        font-size: clamp(21px, 5.5vw, 29px);
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .boot-splash__title span {
        display: inline-block;
        opacity: 0;
        transform: translateY(12px);
        animation: boot-rise 450ms cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }
      .boot-splash__title span:nth-child(1) {
        animation-delay: 1050ms;
      }
      .boot-splash__title span:nth-child(2) {
        animation-delay: 1090ms;
      }
      .boot-splash__title span:nth-child(3) {
        animation-delay: 1130ms;
      }
      .boot-splash__title span:nth-child(4) {
        animation-delay: 1170ms;
      }
      .boot-splash__title span:nth-child(5) {
        animation-delay: 1210ms;
      }
      .boot-splash__title span:nth-child(6) {
        animation-delay: 1250ms;
      }
      .boot-splash__title span:nth-child(7) {
        animation-delay: 1290ms;
      }
      @keyframes boot-rise {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash {
          --boot-settle: 0ms;
          transition: none;
        }
        .boot-splash__hand,
        .boot-splash__title span {
          animation: none;
        }
        .boot-splash__title span {
          opacity: 1;
          transform: none;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Cadence</title>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <svg
        class="boot-splash__mark"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.1"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="9" />
        <g class="boot-splash__hand boot-splash__hand--minute">
          <line x1="12" y1="12" x2="12" y2="6.4" />
        </g>
        <g class="boot-splash__hand boot-splash__hand--hour">
          <line x1="12" y1="12" x2="12" y2="8.6" />
        </g>
        <circle cx="12" cy="12" r="1.05" fill="currentColor" stroke="none" />
      </svg>
      <p class="boot-splash__title"><span>c</span><span>a</span><span>d</span><span>e</span><span>n</span><span>c</span><span>e</span></p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
