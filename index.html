<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Two theme colours, so the OS chrome around an installed window
         follows the same system/light/dark preference the app itself does
         rather than pinning one of the two. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="A personal time-blocking scheduler: plan the day in blocks, and see where the hours actually went." />
    <script>
      /* Stamp the stored theme onto <html> before first paint, so the app's
         first frame — the sign-in screen, or the skeleton of a returning
         session — is already in the right one. data-theme is the only thing
         tokens.css keys off, and until React mounts nothing else writes it.
         'system' is deliberately left unstamped, which is exactly the state
         tokens.css expects: with no explicit choice, its media query decides.
         Runs here, synchronously in <head>, so there is no wrong-theme frame
         to correct. */
      try {
        var bootTheme = localStorage.getItem('cadence-app:theme')
        if (bootTheme === 'light' || bootTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', bootTheme)
        }
      } catch (e) {
        /* No storage access: <html> stays unstamped, the media query owns the
           theme, and ThemeContext settles it on mount. */
      }
    </script>
    <style>
      /* The page colour for the chosen theme, before the bundle's stylesheet has
         arrived (in development it is injected by script, after first paint),
         so the very first frame is already the right colour rather than the
         browser's default white. The same two values as tokens.css's Paper;
         once that loads, `body { background: var(--color-page) }` owns it. */
      html {
        background: #f9f9f7;
      }
      html[data-theme='dark'] {
        background: #050505;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) {
          background: #050505;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Cadence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
