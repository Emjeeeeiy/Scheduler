<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Two theme colours, so the OS chrome around an installed window
         follows the same system/light/dark preference the app itself does
         rather than pinning one of the two. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="A personal time-blocking scheduler: plan the day in blocks, and see where the hours actually went." />
    <script>
      /* Stamp the boot splash theme before first paint: the stored choice
         wins ('dark' is also the fallback for first-time visitors — see
         useTheme), otherwise the OS setting decides. Runs here, synchronously
         in <head>, so the launch screen never flashes the wrong theme. */
      try {
        var bootTheme = localStorage.getItem('cadence-app:theme')
        var bootDark =
          bootTheme !== 'light' &&
          (bootTheme === 'dark' ||
            !bootTheme ||
            (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.className += bootDark ? ' boot-dark' : ' boot-light'
        /* Returning session? Skip the launch screen entirely — signed-in
           visits go straight to the skeleton, never watching the splash for
           an app they're already inside. The key's home is lib/sessionHint.js
           (written by AuthContext); duplicated here because a module can't
           load before first paint. */
        if (localStorage.getItem('cadence-app:signed_in') === 'true') {
          document.documentElement.className += ' boot-skip-splash'
        }
      } catch (e) {
        document.documentElement.className += ' boot-dark'
      }
    </script>
    <style>
      /* Boot splash: the launch screen that follows Android's own white+logo
         frame the moment our page takes over. Plain CSS in <head> (not the
         bundle) so it renders the instant the HTML arrives. Same clock
         grammar as ClockIcon (24-unit, 2px round stroke) with its hands set
         to the real time by the script below the markup; the title rises
         letter by letter, then a hairline shimmer holds the eye until React
         dismisses the whole screen on first paint. */
      html.boot-dark body {
        background: #050505;
      }
      html.boot-light body {
        background: #f9f9f7;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #050505;
        color: #ffffff;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 0.28s ease;
      }
      html.boot-light #boot-splash {
        background: #f9f9f7;
        color: #0b0b0b;
      }
      #boot-splash.boot-splash--hide {
        opacity: 0;
        pointer-events: none;
      }
      /* Set pre-paint by the script above when a session is already live:
         the splash never renders a frame, so there is nothing to fade. */
      html.boot-skip-splash #boot-splash {
        display: none;
      }
      .boot-splash__mark {
        width: 46px;
        height: 46px;
        animation: boot-pulse 2.4s ease-in-out infinite;
      }
      .boot-splash__second {
        transform-box: view-box;
        transform-origin: center;
        animation: boot-sweep 60s linear infinite;
      }
      @keyframes boot-sweep {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }
      .boot-splash__title {
        margin: 0;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .boot-splash__title span {
        display: inline-block;
        opacity: 0;
        transform: translateY(12px);
        animation: boot-rise 0.55s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }
      .boot-splash__title span:nth-child(1) {
        animation-delay: 0.05s;
      }
      .boot-splash__title span:nth-child(2) {
        animation-delay: 0.1s;
      }
      .boot-splash__title span:nth-child(3) {
        animation-delay: 0.15s;
      }
      .boot-splash__title span:nth-child(4) {
        animation-delay: 0.2s;
      }
      .boot-splash__title span:nth-child(5) {
        animation-delay: 0.25s;
      }
      .boot-splash__title span:nth-child(6) {
        animation-delay: 0.3s;
      }
      .boot-splash__title span:nth-child(7) {
        animation-delay: 0.35s;
      }
      @keyframes boot-rise {
        to {
          opacity: 1;
          transform: none;
        }
      }
      .boot-splash__bar {
        width: 120px;
        height: 2px;
        border-radius: 999px;
        background: currentColor;
        opacity: 0.14;
        overflow: hidden;
        position: relative;
      }
      .boot-splash__bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: currentColor;
        opacity: 0.9;
        animation: boot-slide 1.3s ease-in-out infinite;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(280%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash {
          transition: none;
        }
        .boot-splash__mark,
        .boot-splash__second,
        .boot-splash__title span,
        .boot-splash__bar::after {
          animation: none;
        }
        .boot-splash__title span {
          opacity: 1;
          transform: none;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Cadence</title>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <svg
        class="boot-splash__mark"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <circle cx="12" cy="12" r="9" />
        <g id="boot-hour">
          <line x1="12" y1="12" x2="12" y2="8.2" />
        </g>
        <g id="boot-minute">
          <line x1="12" y1="12" x2="12" y2="7" />
        </g>
        <g id="boot-second">
          <line
            class="boot-splash__second"
            x1="12"
            y1="13.2"
            x2="12"
            y2="6.5"
            stroke-width="1.3"
            opacity="0.55"
          />
        </g>
        <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none" />
      </svg>
      <p class="boot-splash__title"><span>C</span><span>a</span><span>d</span><span>e</span><span>n</span><span>c</span><span>e</span></p>
      <div class="boot-splash__bar"></div>
    </div>
    <script>
      /* Point the splash hands at the real local time (same sweep math as
         ClockIcon's clockHandAngles). Runs synchronously during parse, right
         after the markup above, so the logo is already correct on first
         paint; the CSS sweep on the second hand adds the motion from there. */
      try {
        var bootNow = new Date()
        var bootS = bootNow.getSeconds() + bootNow.getMilliseconds() / 1000
        var bootM = bootNow.getMinutes() + bootS / 60
        var bootH = (bootNow.getHours() % 12) + bootM / 60
        var bootSet = function (id, deg) {
          var el = document.getElementById(id)
          if (el) el.setAttribute('transform', 'rotate(' + deg + ' 12 12)')
        }
        bootSet('boot-hour', bootH * 30)
        bootSet('boot-minute', bootM * 6)
        bootSet('boot-second', (bootS % 60) * 6)
      } catch (e) {
        /* Hands stay pointing up — still the brand mark, just not live. */
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
